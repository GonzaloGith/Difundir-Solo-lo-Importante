<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <!-- 📱 ESTA LÍNEA CORRIGE EL TAMAÑO EN CELULARES -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📢 DIFUSIÓN CUIDADOS VIEJA</title>
    <style>
      body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('https://images.unsplash.com/photo-1576765608535-5f04d1e3f289?q=80&w=1200&auto=format&fit=crop');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        text-align: center;
        margin: 0;
        padding: 15px; /* Menos margen para que aproveche el alto del celular */
        min-height: 100vh;
        box-sizing: border-box;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      h2 {
        color: #0056b3;
        font-size: 24px; /* Letras un poco más grandes y claras */
        margin-top: 0;
        margin-bottom: 12px;
        text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
      }
      /* Tarjeta adaptada para ocupar casi todo el ancho del teléfono */
      .form-container {
        background-color: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(5px);
        border-radius: 16px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
        display: block;
        padding: 25px 20px;
        text-align: left;
        width: 100%;
        max-width: 450px; /* Crece mejor en pantallas medianas */
        box-sizing: border-box;
      }
      .aviso-importante {
        background-color: #fff3cd;
        color: #856404;
        border-left: 5px solid #ffc107;
        padding: 12px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: bold;
        margin-bottom: 20px;
        line-height: 1.4;
      }
      label {
        font-weight: bold;
        color: #333;
        display: block;
        margin-top: 18px;
        font-size: 15px; /* Más cómodo de leer */
      }
      select, textarea, input {
        width: 100%;
        margin-top: 6px;
        padding: 13px; /* Más espacioso para tocar fácil con el dedo */
        border-radius: 8px;
        border: 1px solid #bbb;
        font-size: 16px; /* Evita que iOS y Android hagan zoom raro al escribir */
        box-sizing: border-box;
      }
      .radio-group {
        margin-top: 10px;
        display: flex;
        flex-direction: column; /* Apilados en celular para que no se amontonen */
        gap: 10px;
      }
      .radio-group label {
        display: flex;
        align-items: center;
        font-weight: normal;
        margin-top: 0;
        cursor: pointer;
        font-size: 16px;
      }
      .radio-group input {
        width: 22px; /* Botones de opción más grandes para el dedo */
        height: 22px;
        margin-right: 10px;
        margin-top: 0;
      }
      button {
        background-color: #25D366;
        color: white;
        border: none;
        width: 100%;
        padding: 16px; /* Botón bien gordo y fácil de apretar */
        border-radius: 8px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 25px;
        box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
      }
      button:hover {
        background-color: #128C7E;
      }
      .oculto {
        display: none;
      }
    </style>
  </head>
  <body>

    <div class="form-container">
      <h2>📢 DIFUSIÓN CUIDADOS VIEJA</h2>
      
      <div class="aviso-importante">
        ⚠️ ATENCIÓN:<br>
        Usemos esto SOLO para lo importante. Anotá primero la lista abajo (separada por comas) para mandar todo junto. Y si ven que necesitamos agregar algo más al formulario, ¡avísenme!
      </div>

      <label for="nombre">👤 Nombre:</label>
      <select id="nombre">
        <option value="MONA">MONA</option>
        <option value="PITI">PITI</option>
        <option value="GORDITA">GORDITA</option>
        <option value="CHEO">CHEO</option>
        <option value="YECO">YECO</option>
        <option value="LAURA">LAURA</option>
        <option value="Dra/Doc">Dra/Dr</option>
        <option value="COQUITO">COQUITO</option>
        <option value="ELI">ELI</option>
        <option value="GRINGO">GRINGO</option>
      </select>

      <label for="motivo">📋 Motivo del mensaje:</label>
      <select id="motivo" onchange="controlarCampos()">
        <option value="⚠️ URGENCIA">⚠️ URGENCIA</option>
        <option value="🩺 PARTE MÉDICO">🩺 PARTE MÉDICO</option>
        <option value="👵 REPORTE ESTADO DE LA VIEJA">👵 REPORTE ESTADO DE LA VIEJA</option>
        <option value="📅 DÍAS Y HORARIOS DISPONIBLES">📅 DÍAS Y HORARIOS DISPONIBLES PARA CUIDARLA</option>
        <option value="📅 QUE DÍAS Y HORARIOS ESTAN FALTANDO CUBRIR">📅 QUE DÍAS Y HORARIOS ESTAN FALTANDO CUBRIR</option>
        <option value="🧴 INSUMOS NECESARIOS">🧴 QUE INSUMOS SE NECESITAN EN EL DÍA</option>
        <option value="🧴 NECESITO QUE ME CAMBIEN EL /DIA/HORARIO">🧴 NECESITO QUE ME CAMBIEN EL /DIA/HORARIO</option>
        <option value="🧴 ME TENGO QUE RETIRAR ANTES">🧴 ME TENGO QUE RETIRAR ANTES QUIEN ME PUEDE REEMPLAZAR</option>
        <option value="🧴 EL DÍA .....A LAS...NO HAY NADIE PARA QUEDARSE">🧴 EL DÍA .....A LAS...NO HAY NADIE PARA QUEDARSE</option>
        <option value="👵 LA MAMI ME PIDIO SI">👵 LA MAMI ME PIDIO SI </option>
        <option value="👵 NECESITAMOS COMPRAR">👵 NECESITAMOS COMPRAR </option>         
      </select>

      <div id="seccionFormato">
        <label>🎙️ ¿Cómo vas a mandar el detalle?</label>
        <div class="radio-group">
          <label><input type="radio" name="formato" value="texto" checked onchange="cambiarFormato()"> Escribir texto</label>
          <label><input type="radio" name="formato" value="audio" onchange="cambiarFormato()"> Mandar Audio 🎙️</label>
        </div>
      </div>

      <div id="seccionDetalle">
        <label for="detalle">📝 Detalle / Lista:</label>
        <textarea id="detalle" placeholder="Escribí el detalle o lista (separada por comas)..." rows="4"></textarea>
      </div>

      <div id="seccionCalendario" class="oculto">
        <label for="fecha">📅 Día involucrado:</label>
        <input type="date" id="fecha">

        <label for="horaInicio">🕐 Hora de inicio:</label>
        <input type="time" id="horaInicio">

        <label for="horaFin">🕒 Hora de fin:</label>
        <input type="time" id="horaFin">
      </div>

      <button onclick="enviar()">📨 Enviar Mensaje</button>
    </div>

    <script>
      function controlarCampos() {
        var motivo = document.getElementById("motivo").value;
        var seccionDetalle = document.getElementById("seccionDetalle");
        var seccionFormato = document.getElementById("seccionFormato");
        var seccionCalendario = document.getElementById("seccionCalendario");

        if (motivo === "📅 DÍAS Y HORARIOS DISPONIBLES" || motivo === "📅 QUE DÍAS Y HORARIOS ESTAN FALTANDO CUBRIR") {
          seccionCalendario.classList.remove("oculto");
          seccionDetalle.classList.add("oculto");
          seccionFormato.classList.add("oculto");
        } else {
          seccionCalendario.classList.add("oculto");
          seccionDetalle.classList.remove("oculto");
          seccionFormato.classList.remove("oculto");
        }
      }

      function cambiarFormato() {
        var formato = document.querySelector('input[name="formato"]:checked').value;
        var detalle = document.getElementById("detalle");
        
        if (formato === "audio") {
          detalle.value = "*(Voy a enviar un audio aclarando este punto, por favor escúchenlo)*";
          detalle.disabled = true; 
        } else {
          detalle.value = "";
          detalle.disabled = false;
        }
      }

      function enviar() {
        var nombre = document.getElementById("nombre").value;
        var motivo = document.getElementById("motivo").value;
        var detalleRaw = document.getElementById("detalle").value;
        var fecha = document.getElementById("fecha").value;
        var horaInicio = document.getElementById("horaInicio").value;
        var horaFin = document.getElementById("horaFin").value;
        var horaActual = new Date().toLocaleTimeString("es-AR", {hour: '2-digit', minute: '2-digit'});

        var fechaFormateada = "";
        if (fecha) {
          var dateParts = fecha.split('-');
          var fechaReal = new Date(dateParts[0], dateParts[1] - 1, dateParts[2]);
          var opciones = { weekday: 'long', day: '2-digit', month: '2-digit' };
          fechaFormateada = fechaReal.toLocaleDateString("es-AR", opciones);
        }

        var texto = "🕒 *" + horaActual + "* — *" + nombre + "*\n\n📢 *Motivo:* " + motivo;
        
        if (motivo !== "📅 DÍAS Y HORARIOS DISPONIBLES" && motivo !== "📅 QUE DÍAS Y HORARIOS ESTAN FALTANDO CUBRIR") {
          if (detalleRaw) {
            if (motivo.includes("INSUMOS") || detalleRaw.includes(",")) {
              texto += "\n📋 *Lista de ítems:*";
              var elementos = detalleRaw.split(/[,\n]+/);
              for (var i = 0; i < elementos.length; i++) {
                var item = elementos[i].trim();
                if (item !== "") {
                  texto += "\n🔹 " + item;
                }
              }
            } else {
              texto += "\n📝 *Detalle:* " + detalleRaw;
            }
          }
        } else {
          if (fechaFormateada) texto += "\n📅 *Día:* " + fechaFormateada;
          if (horaInicio && horaFin) texto += "\n⏰ *Horario:* de " + horaInicio + " a " + horaFin + " hs";
        }

        var enlace = "https://api.whatsapp.com/send?text=" + encodeURIComponent(texto);
        window.open(enlace, "_blank");
      }

      controlarCampos();
    </script>
  </body>
</html>
